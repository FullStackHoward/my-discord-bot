name: Deploy Vice Verify Bot
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/public_html/vice-verify-bot
            git reset --hard HEAD
            git pull origin main
            npm ci
            pm2 restart vice-verify-bot
            # The Vice Arcade bot runs from this same checkout as its own process. It is
            # first started only once its token is in .env, so a deploy before the Vice
            # Arcade application is set up does not leave PM2 restarting a bot that cannot
            # log in.
            if grep -q '^VICE_ARCADE_BOT_TOKEN=.' .env; then
              pm2 restart vice-arcade-bot || pm2 start arcade.js --name vice-arcade-bot
              pm2 save
            fi